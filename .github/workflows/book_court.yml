name: Book Tennis Court

on:
  schedule:
    - cron: "58 3 * * *"  # 23:58 ET (UTC-4, EDT)
  workflow_dispatch:

jobs:
  book:
    runs-on: ubuntu-latest

    env:
      BL_USERNAME: ${{ secrets.BL_USERNAME }}
      BL_PASSWORD: ${{ secrets.BL_PASSWORD }}
      NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
      NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
      NOTIFY_EMAIL_PASSWORD: ${{ secrets.NOTIFY_EMAIL_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-root --only main

      - name: Install Playwright browsers
        run: poetry run playwright install chromium --with-deps

      - name: Run booking script
        run: poetry run python court_booker.py